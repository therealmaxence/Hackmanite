<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading DaGEx</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Inter', sans-serif;
      background: transparent;
      color: #fff2f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      -webkit-app-region: drag; /* Allows moving window by dragging splash */
    }

    /* Outer card matching new sharp professional styling */
    .splash-card {
      position: relative;
      width: 440px;
      height: 440px;
      padding: 45px;
      border-radius: 4px;
      background: radial-gradient(circle at top left, #1f0512 0%, #120108 100%);
      border: 1px solid #3a0f25;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Top accent light - secondary (coral) to primary (gold) */
    .splash-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(216, 66, 42, 0.4) 30%, rgba(252, 182, 42, 0.4) 70%, transparent 100%);
    }

    /* Logo area */
    .logo-area {
      margin-top: 15px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Graph SVG animations */
    .connecting-line {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: drawLine 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .center-node {
      transform-origin: 50px 50px;
      animation: breathe 4s ease-in-out infinite;
    }

    /* Brand typography */
    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 40%, #fcb62a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .version-badge {
      font-size: 9px;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      color: #fcb62a;
      background: rgba(252, 182, 42, 0.06);
      padding: 3px 8px;
      border-radius: 2px;
      border: 1px solid rgba(252, 182, 42, 0.15);
      letter-spacing: 0.05em;
    }

    /* Progress section */
    .progress-section {
      width: 100%;
      margin-top: 10px;
    }

    .status-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .status-text {
      font-size: 12px;
      color: #ba95a6;
      font-weight: 400;
      letter-spacing: 0.01em;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }

    .percentage-text {
      font-size: 12px;
      color: #fcb62a;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
    }

    .loader-container {
      position: relative;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 1px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #d8422a 0%, #fcb62a 100%);
      border-radius: 1px;
      box-shadow: 0 0 10px rgba(252, 182, 42, 0.7);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .footer {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 0.05em;
      font-weight: 500;
      text-transform: uppercase;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="splash-card">
    <div class="logo-area">
      <!-- Minimalist Isometric Geometric Graph Emblem -->
      <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 3D Isometric Facets representing Data Lake volumes -->
        <!-- Top Face -->
        <path d="M 50,15 L 80,32.5 L 50,50 L 20,32.5 Z" fill="url(#topFaceGrad)" stroke="#3a0f25" stroke-width="0.5" />
        <!-- Left Face -->
        <path d="M 20,32.5 L 50,50 L 50,85 L 20,67.5 Z" fill="url(#leftFaceGrad)" stroke="#3a0f25" stroke-width="0.5" />
        <!-- Right Face -->
        <path d="M 50,50 L 80,32.5 L 80,67.5 L 50,85 Z" fill="url(#rightFaceGrad)" stroke="#3a0f25" stroke-width="0.5" />

        <!-- Knowledge Graph Connections (Wireframe/Edges) -->
        <!-- Outer Edges -->
        <line x1="50" y1="15" x2="80" y2="32.5" stroke="#3a0f25" stroke-width="1.5" />
        <line x1="80" y1="32.5" x2="80" y2="67.5" stroke="#3a0f25" stroke-width="1.5" />
        <line x1="80" y1="67.5" x2="50" y2="85" stroke="#3a0f25" stroke-width="1.5" />
        <line x1="50" y1="85" x2="20" y2="67.5" stroke="#3a0f25" stroke-width="1.5" />
        <line x1="20" y1="67.5" x2="20" y2="32.5" stroke="#3a0f25" stroke-width="1.5" />
        <line x1="20" y1="32.5" x2="50" y2="15" stroke="#3a0f25" stroke-width="1.5" />

        <!-- Primary Highlighted Relationships (Active Entity Paths) -->
        <line x1="50" y1="15" x2="50" y2="50" stroke="#fcb62a" stroke-width="2" class="connecting-line" />
        <line x1="50" y1="50" x2="80" y2="67.5" stroke="#d8422a" stroke-width="2" class="connecting-line" />
        <line x1="50" y1="50" x2="20" y2="67.5" stroke="#fcb62a" stroke-width="2" class="connecting-line" stroke-dasharray="60" stroke-dashoffset="60" style="animation: drawLine 2.5s ease-out forwards; animation-delay: 0.5s;" />

        <!-- Secondary/Dashed Background Paths -->
        <line x1="20" y1="32.5" x2="50" y2="50" stroke="rgba(255, 242, 245, 0.2)" stroke-width="1.25" stroke-dasharray="3 3" />
        <line x1="80" y1="32.5" x2="50" y2="50" stroke="rgba(255, 242, 245, 0.2)" stroke-width="1.25" stroke-dasharray="3 3" />
        <line x1="50" y1="50" x2="50" y2="85" stroke="rgba(255, 242, 245, 0.2)" stroke-width="1.25" stroke-dasharray="3 3" />

        <!-- Graph Entity Nodes at Vertices -->
        <circle cx="50" cy="15" r="4" fill="#fcb62a" />
        <circle cx="20" cy="32.5" r="4" fill="#d8422a" />
        <circle cx="80" cy="32.5" r="4" fill="#fcb62a" />
        <circle cx="20" cy="67.5" r="4" fill="#fcb62a" />
        <circle cx="80" cy="67.5" r="4" fill="#d8422a" />
        <circle cx="50" cy="85" r="4" fill="#fcb62a" />

        <!-- Center Entity Node (Core Hub) -->
        <circle cx="50" cy="50" r="6.5" fill="#fff2f5" stroke="#fcb62a" stroke-width="2.5" class="center-node" />

        <defs>
          <linearGradient id="topFaceGrad" x1="50" y1="15" x2="50" y2="50" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#330a1f" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#1f0512" stop-opacity="0.85" />
          </linearGradient>
          <linearGradient id="leftFaceGrad" x1="20" y1="32.5" x2="50" y2="85" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1f0512" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#120108" stop-opacity="0.95" />
          </linearGradient>
          <linearGradient id="rightFaceGrad" x1="80" y1="32.5" x2="50" y2="85" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#d8422a" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#fcb62a" stop-opacity="0.02" />
          </linearGradient>
        </defs>
      </svg>
    </div>
    
    <div class="brand-container">
      <h1>DaGEx</h1>
      <span class="version-badge">NATIVE DESKTOP v1.4.0</span>
    </div>

    <div class="progress-section">
      <div class="status-wrapper">
        <div class="status-text" id="status">Initializing native environment...</div>
        <div class="percentage-text" id="percentage">0%</div>
      </div>
      <div class="loader-container">
        <div class="progress-bar" id="progress"></div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const progressBar = document.getElementById('progress');
    const statusText = document.getElementById('status');
    const percentageText = document.getElementById('percentage');

    ipcRenderer.on('status-update', (event, { status, percent }) => {
      statusText.innerText = status;
      progressBar.style.width = percent + '%';
      percentageText.innerText = percent + '%';
    });
  </script>
</body>
</html>

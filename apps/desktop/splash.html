<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Hackmanite by GEODE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Inter', sans-serif;
      background: transparent;
      color: #f0f0f4;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .splash-card {
      position: relative;
      width: 460px;
      height: 460px;
      padding: 40px;
      border-radius: 6px;
      background-color: #18171c;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
      border: none;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .splash-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(124, 58, 237, 0.4) 30%, rgba(217, 70, 239, 0.4) 70%, transparent 100%);
    }

    /* Logo area */
    .logo-area {
      position: relative;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      width: 100%;
      height: 140px;
    }

    .logo-glow {
      position: absolute;
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.45) 0%, rgba(217, 70, 239, 0.15) 55%, transparent 100%);
      filter: blur(10px);
      z-index: 1;
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(0.9); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }

    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 40%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .by-geode {
      font-size: 11px;
      font-weight: 600;
      color: #a78bfa;
      background: rgba(124, 58, 237, 0.2);
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }

    .version-badge {
      font-size: 9px;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      color: #80808c;
      background: #222129;
      padding: 4px 10px;
      border-radius: 4px;
      border: none;
      letter-spacing: 0.05em;
    }

    .progress-section {
      width: 100%;
      margin-top: 10px;
    }

    .status-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .status-text {
      font-size: 12px;
      color: #80808c;
      font-weight: 400;
      letter-spacing: 0.01em;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }

    .percentage-text {
      font-size: 12px;
      color: #a78bfa;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
    }

    .loader-container {
      position: relative;
      width: 100%;
      height: 3px;
      background: #0d0c10;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #7c3aed;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(124, 58, 237, 0.4);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

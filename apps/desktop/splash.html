<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Hackmanite</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Inter', sans-serif;
      background: transparent;
      color: #f0f0f4;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .splash-card {
      position: relative;
      width: 440px;
      height: 440px;
      padding: 45px;
      border-radius: 6px;
      background-color: #18171c;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
      border: none;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .splash-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(124, 58, 237, 0.4) 30%, rgba(217, 70, 239, 0.4) 70%, transparent 100%);
    }

    /* Logo area */
    .logo-area {
      position: relative;
      margin-top: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 130px;
      height: 130px;
    }

    .logo-glow {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.45) 0%, rgba(217, 70, 239, 0.15) 55%, transparent 100%);
      filter: blur(10px);
      z-index: 1;
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(0.9); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }

    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 40%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .version-badge {
      font-size: 9px;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      color: #a78bfa;
      background: #222129;
      padding: 4px 10px;
      border-radius: 4px;
      border: none;
      letter-spacing: 0.05em;
    }

    .progress-section {
      width: 100%;
      margin-top: 10px;
    }

    .status-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .status-text {
      font-size: 12px;
      color: #80808c;
      font-weight: 400;
      letter-spacing: 0.01em;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }

    .percentage-text {
      font-size: 12px;
      color: #a78bfa;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
    }

    .loader-container {
      position: relative;
      width: 100%;
      height: 3px;
      background: #0d0c10;
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #7c3aed;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(124, 58, 237, 0.4);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .footer {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.15);
      letter-spacing: 0.05em;
      font-weight: 500;
      text-transform: uppercase;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="splash-card">
    <div class="logo-area">
      <div class="logo-glow"></div>
      <img src="hackmanite_main_nobg.png" alt="Hackmanite Logo" width="100" height="100" style="position: relative; z-index: 2; object-fit: contain;" />
    </div>
    
    <div class="brand-container">
      <h1>Hackmanite</h1>
      <span class="version-badge">NATIVE DESKTOP v1.0.0</span>
    </div>

    <div class="progress-section">
      <div class="status-wrapper">
        <div class="status-text" id="status">Initializing native environment...</div>
        <div class="percentage-text" id="percentage">0%</div>
      </div>
      <div class="loader-container">
        <div class="progress-bar" id="progress"></div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const progressBar = document.getElementById('progress');
    const statusText = document.getElementById('status');
    const percentageText = document.getElementById('percentage');

    ipcRenderer.on('status-update', (event, { status, percent }) => {
      statusText.innerText = status;
      progressBar.style.width = percent + '%';
      percentageText.innerText = percent + '%';
    });
  </script>
</body>
</html>

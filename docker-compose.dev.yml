services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./data/uploads:/app/uploads
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"

  nlp:
    environment:
      KUZU_DB_PATH: /app/kuzu_data/kuzu.db
      KUZU_BUFFER_POOL_SIZE: ${KUZU_BUFFER_POOL_SIZE:-}
    volumes:
      - ./data/uploads:/app/uploads:ro
      - ./apps/nlp-service:/app
      - kuzu_data:/app/kuzu_data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-exclude "uploads/*"
services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/hackmanite?schema=public&connection_limit=10'
      NLP_SERVICE_URL: http://nlp:8000
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 500
      NODE_OPTIONS: '--max-old-space-size=4096'
    depends_on:
      nlp:
        condition: service_started
      postgres:
        condition: service_started
    volumes:
      - ./data/uploads:/app/uploads
    networks:
      - app-network
    restart: unless-stopped

  nlp:
    build:
      context: ./apps/nlp-service
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      UPLOAD_DIR: /app/uploads
      KUZU_DB_PATH: /app/kuzu_data/kuzu.db
      KUZU_BUFFER_POOL_SIZE: ${KUZU_BUFFER_POOL_SIZE:-}
      LOG_LEVEL: info
    volumes:
      - ./data/uploads:/app/uploads:ro
      - kuzu_data:/app/kuzu_data
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hackmanite
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  kuzu_data:
    driver: local
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
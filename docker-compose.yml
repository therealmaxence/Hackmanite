services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: 'file:/app/data/dev.db?connection_limit=10&socket_timeout=900'
      NLP_SERVICE_URL: http://nlp:8000
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 500
      NODE_OPTIONS: '--max-old-space-size=4096'
    depends_on:
      nlp:
        condition: service_started
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/db:/app/data
    networks:
      - app-network
    restart: unless-stopped

  nlp:
    build:
      context: ./apps/nlp-service
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      UPLOAD_DIR: /app/uploads
      KUZU_DB_PATH: /app/kuzu_data/kuzu.db
      KUZU_BUFFER_POOL_SIZE: ${KUZU_BUFFER_POOL_SIZE:-}
      LOG_LEVEL: info
    volumes:
      - ./data/uploads:/app/uploads:ro
      - kuzu_data:/app/kuzu_data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  kuzu_data:
    driver: local

networks:
  app-network:
    driver: bridge
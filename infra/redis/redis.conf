# Redis 7 Configuration — DataLake Entity Graph Explorer

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence — AOF for durability
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Logging
loglevel notice
logfile ""

# Timeouts
timeout 300
tcp-keepalive 60

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Keyspace notifications (for Bull queue events)
notify-keyspace-events "Ex"

# Save snapshots
save 900 1
save 300 10
save 60 10000

# Max connections
maxclients 100

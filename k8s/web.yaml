apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hackmanite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: hackmanite-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hackmanite-secret
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: hackmanite-secret
                  key: SESSION_SECRET
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hackmanite-secret
                  key: MISTRAL_API_KEY
            - name: NLP_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: hackmanite-config
                  key: NLP_SERVICE_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: hackmanite-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: hackmanite-config
                  key: KAFKA_CLIENT_ID
            - name: SHARED_CACHE_DIR
              valueFrom:
                configMapKeyRef:
                  name: hackmanite-config
                  key: SHARED_CACHE_DIR
            - name: UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: hackmanite-config
                  key: UPLOAD_DIR
            - name: NEXT_PUBLIC_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: hackmanite-config
                  key: NEXT_PUBLIC_APP_URL
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: hackmanite-config
                  key: NODE_ENV
          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads
      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: hackmanite-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: hackmanite
spec:
  ports:
    - port: 3000
  selector:
    app: web
